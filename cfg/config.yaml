dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  default-nameserver:				# 只用于解析 nameserver 中域名格式的 DNS 服务器,可使用 UDP/DoT/DoH,只能使用纯 IP 地址
