dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  default-nameserver:				# 只用于解析 nameserver 中域名格式的 DNS 服务器,可使用 UDP/DoT/DoH,只能使用纯 IP 地址
    - 223.5.5.5
    - 119.29.29.29
    - 223.6.6.6
    - 114.114.114.114
  direct-nameserver:				# 用于 direct 出口域名解析的 DNS 服务器，如果不填则遵循 nameserver-policy、nameserver 和 fallback 的配置
#    - system
    - 223.5.5.5
    - 119.29.29.29
    - 223.6.6.6
  proxy-server-nameserver:			# 用于解析代理节点的域名
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver:					# 除 nameserver-policy 指定规则外的所有域名都由 nameserver 解析, 默认走代理
##    - 1.1.1.1
##    - 8.8.8.8
    - https://dns.alidns.com/dns-query
    - https://223.5.5.5/dns-query
    - tls://dns.adguard-dns.com
#  fallback:					# 后备域名解析服务器，一般情况下使用境外 DNS, 保证结果可信
#    - tls://1.1.1.1:853
#    - tls://dns.opendns.com
#    - tls://dns.umbrella.com
#    - tls://dns.sse.cisco.com
#    - tls://dns.adguard-dns.com
